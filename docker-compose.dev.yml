# For working on the code: mounts this folder into the container, so a reload needs no image build.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# tools/reload.sh
services:
  iris:
    volumes:
      - ./:/home/irisowner/dev
    environment:
      - BR_RECORD=${BR_RECORD:-0}
      - BR_PRICE_IN=${BR_PRICE_IN:-}
      - BR_PRICE_OUT=${BR_PRICE_OUT:-}
# A narrow fixed network for development, so Docker does not take a whole /16 that other stacks on the same
# machine may need. The main docker-compose.yml keeps Docker's default for anyone else.
networks:
  default:
    name: blast-radius-review-dev
    ipam:
      config:
        - subnet: 10.250.73.0/24
